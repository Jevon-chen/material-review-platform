<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>捷途素材预审台 · 审核专用</title>
<style>
:root{--bg-primary:#0a1628;--bg-secondary:#0f1f3a;--bg-card:#152238;--bg-hover:#1a2d4a;--bg-input:#0d1a2e;--border:#1e3a5f;--border-light:#2a4a6b;--text-primary:#e8edf5;--text-secondary:#8899b0;--text-muted:#5a6f8a;--accent:#00A2AE;--accent-light:#00c4d2;--accent-bg:rgba(0,162,174,.12);--success:#34d399;--success-bg:rgba(52,211,153,.12);--warning:#fbbf24;--warning-bg:rgba(251,191,36,.12);--danger:#f87171;--danger-bg:rgba(248,113,113,.12);--info:#60a5fa;--info-bg:rgba(96,165,250,.12);--premium:#f59e0b;--premium-bg:rgba(245,158,11,.12);--brand-jt:#00A2AE;--brand-sh:#8b5cf6;--brand-zh:#f59e0b;--purple:#a78bfa;--purple-bg:rgba(167,139,250,.12);--radius:8px;--radius-lg:12px;--shadow:0 4px 24px rgba(0,0,0,.3);--transition:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.6;min-height:100vh;}
a{color:var(--accent);text-decoration:none;}
button{cursor:pointer;border:none;font-family:inherit;}
input,select,textarea{font-family:inherit;}
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0a1628,#0f2847,#0a1628);}
.login-box{width:420px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 40px;box-shadow:var(--shadow);}
.login-logo{text-align:center;margin-bottom:36px;}
.login-logo h1{font-size:24px;font-weight:700;margin-bottom:4px;}
.login-logo p{font-size:13px;color:var(--text-muted);}
.form-group{margin-bottom:20px;}
.form-group label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;font-weight:500;}
.form-group input,.form-group select,.form-group textarea{width:100%;height:42px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;color:var(--text-primary);font-size:14px;outline:none;transition:var(--transition);}
.form-group textarea{height:80px;padding:10px 14px;resize:vertical;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.form-group select option{background:var(--bg-secondary);}
.form-hint{font-size:11px;color:var(--text-muted);margin-top:4px;}
.login-error{background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:none;}
.login-error.show{display:block;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 20px;border-radius:var(--radius);font-size:14px;font-weight:500;transition:var(--transition);white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;width:100%;height:44px;font-size:15px;}
.btn-primary:hover{background:var(--accent-light);transform:translateY(-1px);}
.btn-sm{height:32px;padding:0 12px;font-size:13px;}
.btn-xs{height:26px;padding:0 8px;font-size:12px;}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-light);}
.btn-success{background:var(--success);color:#fff;}.btn-success:hover{opacity:.9;}
.btn-warning{background:var(--warning);color:#000;}.btn-warning:hover{opacity:.9;}
.btn-danger{background:var(--danger);color:#fff;}.btn-danger:hover{opacity:.9;}
.btn-accent{background:var(--accent);color:#fff;}.btn-accent:hover{background:var(--accent-light);}
.btn-premium{background:var(--premium);color:#000;}.btn-premium:hover{opacity:.9;}
.app-layout{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}
.sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
.sidebar-brand h2{font-size:16px;font-weight:700;color:var(--accent);}
.sidebar-brand p{font-size:11px;color:var(--text-muted);margin-top:2px;}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--text-secondary);font-size:14px;cursor:pointer;transition:var(--transition);border-left:3px solid transparent;}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary);}
.nav-item.active{background:var(--accent-bg);color:var(--accent);border-left-color:var(--accent);font-weight:500;}
.nav-icon{width:20px;text-align:center;font-size:16px;}
.nav-section{padding:6px 20px;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:8px;}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);}
.user-info{display:flex;align-items:center;gap:10px;}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;}
.user-detail{flex:1;min-width:0;}
.user-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:11px;color:var(--text-muted);}
.btn-logout{width:28px;height:28px;background:transparent;color:var(--text-muted);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:14px;}
.btn-logout:hover{background:var(--danger-bg);color:var(--danger);}
.main-content{flex:1;margin-left:220px;padding:24px 32px;min-height:100vh;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.page-title{font-size:22px;font-weight:700;}
.page-actions{display:flex;gap:10px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:var(--transition);}
.stat-card:hover{border-color:var(--border-light);}
.stat-label{font-size:13px;color:var(--text-secondary);margin-bottom:8px;}
.stat-value{font-size:28px;font-weight:700;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.card-title{font-size:15px;font-weight:600;}
.card-body{padding:20px;}
.table-wrapper{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;padding:12px 16px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text-secondary);}
tbody tr:hover{background:var(--bg-hover);}
tbody tr:last-child td{border-bottom:none;}
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.tag-success{background:var(--success-bg);color:var(--success);}
.tag-warning{background:var(--warning-bg);color:var(--warning);}
.tag-danger{background:var(--danger-bg);color:var(--danger);}
.tag-info{background:var(--info-bg);color:var(--info);}
.tag-accent{background:var(--accent-bg);color:var(--accent);}
.tag-premium{background:var(--premium-bg);color:var(--premium);}
.tag-brand-jt{background:rgba(0,162,174,.15);color:var(--brand-jt);}
.tag-brand-sh{background:rgba(139,92,246,.15);color:var(--brand-sh);}
.tag-brand-zh{background:rgba(245,158,11,.15);color:var(--brand-zh);}
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.filter-bar select,.filter-bar input{height:36px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:0 12px;color:var(--text-primary);font-size:13px;outline:none;}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent);}
.filter-bar select option{background:var(--bg-secondary);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:var(--transition);}
.modal-overlay.show{opacity:1;visibility:visible;}
.modal{width:600px;max-width:90vw;max-height:85vh;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateY(20px);transition:var(--transition);}
.modal-overlay.show .modal{transform:translateY(0);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
.modal-title{font-size:17px;font-weight:600;}
.modal-close{width:32px;height:32px;background:transparent;color:var(--text-muted);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:18px;}
.modal-close:hover{background:var(--bg-hover);color:var(--text-primary);}
.modal-body{padding:24px;overflow-y:auto;flex:1;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border);}
.progress-bar{height:6px;background:var(--bg-primary);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease;}
.progress-fill.success{background:var(--success);}.progress-fill.warning{background:var(--warning);}.progress-fill.danger{background:var(--danger);}.progress-fill.accent{background:var(--accent);}
.score-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.score-high{background:var(--success-bg);color:var(--success);}
.score-mid{background:var(--warning-bg);color:var(--warning);}
.score-low{background:var(--danger-bg);color:var(--danger);}
.review-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.review-item:last-child{border-bottom:none;}
.review-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.review-dot.pass{background:var(--success);}.review-dot.warn{background:var(--warning);}.review-dot.fail{background:var(--danger);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.target-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state .icon{font-size:48px;margin-bottom:16px;}
.empty-state .title{font-size:16px;font-weight:500;margin-bottom:6px;}
.empty-state .desc{font-size:13px;}
.toast-container{position:fixed;top:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 20px;border-radius:var(--radius);font-size:14px;box-shadow:var(--shadow);animation:slideIn .3s ease;}
.toast-success{background:var(--success);color:#fff;}.toast-error{background:var(--danger);color:#fff;}.toast-info{background:var(--info);color:#fff;}
@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;}
.setting-row-label{font-size:14px;color:var(--text-primary);}
.setting-row-desc{font-size:12px;color:var(--text-muted);margin-top:2px;}
.toggle{position:relative;width:44px;height:24px;cursor:pointer;}
.toggle input{display:none;}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:12px;transition:var(--transition);}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:var(--transition);}
.toggle input:checked+.toggle-slider{background:var(--accent);}
.toggle input:checked+.toggle-slider:before{transform:translateX(20px);}
.weight-input{width:60px;height:32px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);text-align:center;color:var(--text-primary);font-size:14px;outline:none;}
.weight-input:focus{border-color:var(--accent);}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.check-item:last-child{border-bottom:none;}
.check-item input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex-shrink:0;}
.check-item-name{font-size:13px;font-weight:500;color:var(--text-primary);}
.check-item-desc{font-size:12px;color:var(--text-muted);margin-top:2px;}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.slider-row label{font-size:13px;color:var(--text-secondary);min-width:100px;}
.slider-row input[type="range"]{flex:1;accent-color:var(--accent);height:4px;}
.slider-row .slider-val{font-size:14px;font-weight:600;color:var(--accent);min-width:36px;text-align:right;}
.color-dot{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:4px;}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.mat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:var(--transition);cursor:pointer;position:relative;}
.mat-card:hover{border-color:var(--border-light);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3);}
.mat-card.premium{border-color:var(--premium);}
.mat-card.premium::after{content:'\u2B50';position:absolute;top:8px;right:8px;font-size:16px;z-index:2;}
.mat-preview{width:100%;height:160px;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.mat-preview img{width:100%;height:100%;object-fit:cover;}
.mat-preview .play-icon{position:absolute;width:48px;height:48px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;pointer-events:none;}
.mat-preview .type-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:2px 8px;border-radius:4px;font-size:11px;color:#fff;}
.mat-info{padding:14px 16px;}
.mat-info .mat-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mat-info .mat-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.mat-info .mat-footer{display:flex;align-items:center;justify-content:space-between;}
.mat-score{display:flex;align-items:center;gap:6px;}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:32px;text-align:center;cursor:pointer;transition:var(--transition);background:var(--bg-input);}
.upload-area:hover,.upload-area.dragover{border-color:var(--accent);background:var(--accent-bg);}
.upload-area .upload-icon{font-size:40px;margin-bottom:8px;}
.upload-area .upload-text{font-size:14px;color:var(--text-secondary);}
.upload-area .upload-hint{font-size:12px;color:var(--text-muted);margin-top:4px;}
.upload-files{margin-top:12px;}
.upload-file-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-secondary);border-radius:var(--radius);margin-bottom:6px;}
.upload-file-item .file-thumb{width:48px;height:36px;border-radius:4px;overflow:hidden;background:var(--bg-primary);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.upload-file-item .file-thumb img{width:100%;height:100%;object-fit:cover;}
.upload-file-item .file-info{flex:1;min-width:0;}
.upload-file-item .file-name{font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.upload-file-item .file-size{font-size:11px;color:var(--text-muted);}
.upload-file-item .file-remove{cursor:pointer;color:var(--text-muted);font-size:16px;}
.upload-file-item .file-remove:hover{color:var(--danger);}
.view-toggle{display:flex;gap:0;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.view-toggle button{height:34px;padding:0 14px;background:transparent;color:var(--text-muted);font-size:13px;transition:var(--transition);}
.view-toggle button:hover{color:var(--text-primary);}
.view-toggle button.active{background:var(--accent);color:#fff;}
.deadline-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--bg-secondary);border-radius:var(--radius);margin-bottom:16px;border:1px solid var(--border);}
.deadline-bar .dl-icon{font-size:18px;}
.deadline-bar .dl-text{flex:1;font-size:13px;color:var(--text-secondary);}
.deadline-bar .dl-countdown{font-size:14px;font-weight:600;}
.deadline-bar .dl-countdown.urgent{color:var(--danger);}
.deadline-bar .dl-countdown.normal{color:var(--success);}
.deadline-bar .dl-countdown.warn{color:var(--warning);}
.error-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;}
.error-item .ei-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.error-item .ei-content{flex:1;}
.error-item .ei-title{font-size:13px;font-weight:500;color:var(--text-primary);}
.error-item .ei-desc{font-size:12px;color:var(--text-muted);margin-top:2px;}
.error-item .ei-meta{font-size:11px;color:var(--text-muted);margin-top:4px;}
.vm-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;transition:var(--transition);}
.vm-card:hover{border-color:var(--border-light);}
.vm-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.vm-card-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
.vm-card-brand{font-size:12px;padding:2px 10px;border-radius:20px;font-weight:500;}
.vm-card-actions{display:flex;gap:6px;}
.policy-item{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;transition:var(--transition);}
.policy-item:hover{border-color:var(--border-light);}
.policy-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.policy-item-name{font-size:14px;font-weight:600;color:var(--text-primary);}
.policy-item-desc{font-size:12px;color:var(--text-secondary);margin-bottom:6px;}
.policy-item-rule{font-size:12px;color:var(--warning);margin-bottom:6px;}
.policy-item-types{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;}
.policy-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500;}
.policy-tag.active{background:var(--success-bg);color:var(--success);}
.policy-tag.inactive{background:var(--bg-hover);color:var(--text-muted);}
.sw-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:16px;font-size:13px;margin:3px;transition:var(--transition);background:var(--bg-secondary);border:1px solid var(--border);color:var(--text-secondary);}
.sw-tag:hover{border-color:var(--border-light);}
.sw-tag .sw-remove{cursor:pointer;font-size:10px;color:var(--text-muted);width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--transition);}
.sw-tag .sw-remove:hover{background:var(--danger-bg);color:var(--danger);}
.sw-tab{padding:8px 20px;cursor:pointer;border-bottom:2px solid transparent;font-size:14px;color:var(--text-muted);transition:var(--transition);}
.sw-tab:hover{color:var(--text-primary);}
.sw-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.sw-add-row{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.sw-add-row input{flex:1;height:36px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:0 12px;color:var(--text-primary);font-size:13px;outline:none;}
.sw-add-row input:focus{border-color:var(--accent);}
.sw-search{width:100%;max-width:400px;margin-bottom:16px;}
.log-item{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border);transition:var(--transition);}
.log-item:hover{background:var(--bg-hover);}
.log-item:last-child{border-bottom:none;}
.log-time{font-size:12px;color:var(--text-muted);white-space:nowrap;min-width:140px;}
.log-user{font-size:13px;font-weight:500;color:var(--text-primary);min-width:80px;}
.log-action{display:inline-flex;align-items:center;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;}
.log-action.approve{background:var(--success-bg);color:var(--success);}
.log-action.reject{background:var(--danger-bg);color:var(--danger);}
.log-action.premium{background:var(--premium-bg);color:var(--premium);}
.log-action.review{background:var(--info-bg);color:var(--info);}

</style>

<body>

<script>
var API_BASE=window.location.origin+'/api';var WS_URL=(window.location.protocol==='https:'?'wss:':'ws:')+'//'+window.location.host+'/ws';var authToken=localStorage.getItem('jtr_token')||'';var currentUser=null;var wsConn=null;var wsReconnectTimer=null;
var PREVIEW_IMAGES=['https://picsum.photos/seed/jt1/400/240','https://picsum.photos/seed/jt2/400/240','https://picsum.photos/seed/sh1/400/240','https://picsum.photos/seed/sh2/400/240','https://picsum.photos/seed/zh1/400/240','https://picsum.photos/seed/zh2/400/240','https://picsum.photos/seed/jt3/400/240','https://picsum.photos/seed/sh3/400/240'];
function getPreviewUrl(id){var idx=0;if(typeof id==='string'){for(var i=0;i<id.length;i++)idx+=id.charCodeAt(i);idx=idx%PREVIEW_IMAGES.length;}else{idx=id%PREVIEW_IMAGES.length;}return PREVIEW_IMAGES[idx];}
function api(method,path,body){var opts={method:method,headers:{'Authorization':'Bearer '+authToken,'Content-Type':'application/json'}};if(body&&!(body instanceof FormData))opts.body=JSON.stringify(body);if(body instanceof FormData){delete opts.headers['Content-Type'];opts.body=body;}return fetch(API_BASE+path,opts).then(function(r){if(r.status===401){localStorage.removeItem('jtr_token');authToken='';showLogin();throw new Error('unauthorized');}return r.json();});}
function connectWS(){if(!authToken)return;if(wsConn&&wsConn.readyState===WebSocket.OPEN)return;try{wsConn=new WebSocket(WS_URL+'?token='+authToken);wsConn.onopen=function(){clearTimeout(wsReconnectTimer);};wsConn.onmessage=function(evt){try{var msg=JSON.parse(evt.data);if(msg.type==='material_updated'||msg.type==='material_created'||msg.type==='monthly_cleared'){renderPage();}}catch(e){}};wsConn.onclose=function(){wsReconnectTimer=setTimeout(function(){connectWS();},5000);};wsConn.onerror=function(){wsConn.close();};}catch(e){wsReconnectTimer=setTimeout(function(){connectWS();},5000);}}
function getCurrentMonth(){var now=new Date();return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');}
function daysUntil(dateStr){if(!dateStr)return null;var t=new Date(dateStr);var n=new Date();t.setHours(23,59,59);n.setHours(0,0,0);return Math.ceil((t-n)/86400000);}
function showToast(msg,type){type=type||'info';var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;c.appendChild(t);setTimeout(function(){t.remove();},3000);}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function platformTag(p){var m={'抖音':'dy','视频号':'sph','快手':'ks','全平台':'all'};return '<span class="platform-tag '+(m[p]||'all')+'">'+p+'</span>';}
function brandTag(b){var m={'捷途':'tag-brand-jt','山海':'tag-brand-sh','纵横':'tag-brand-zh'};return '<span class="tag '+(m[b]||'tag-info')+'">'+b+'</span>';}
function statusTag(s){var m={'pending':'<span class="tag tag-warning">待审核</span>','ai_reviewed':'<span class="tag tag-info">AI已审</span>','approved':'<span class="tag tag-success">已通过</span>','rejected':'<span class="tag tag-danger">已驳回</span>'};return m[s]||'<span class="tag tag-info">'+s+'</span>';}
function scoreClass(s){if(s>=80)return'score-high';if(s>=60)return'score-mid';return'score-low';}
function progressClass(p){if(p>=80)return'success';if(p>=50)return'warning';return'danger';}
var currentPage='dashboard';
function navigateTo(page){currentPage=page;document.querySelectorAll('.nav-item').forEach(function(item){item.classList.toggle('active',item.dataset.page===page);});renderPage();}
function showLogin(){document.getElementById('appLayout').style.display='none';document.getElementById('loginPage').style.display='flex';}
function doLogin(){document.getElementById('loginPage').style.display='none';document.getElementById('appLayout').style.display='flex';document.getElementById('loginError').classList.remove('show');document.getElementById('userAvatar').textContent=currentUser.name.charAt(0);document.getElementById('userName').textContent=currentUser.name;document.getElementById('userRole').textContent=currentUser.role==='brand'?'品牌方':currentUser.name;currentPage='dashboard';document.querySelectorAll('.nav-item').forEach(function(item){item.classList.toggle('active',item.dataset.page==='dashboard');});connectWS();renderPage();showToast('欢迎回来，'+currentUser.name,'success');}
document.getElementById('loginBtn').addEventListener('click',function(){var username=document.getElementById('loginUsername').value.trim();var password=document.getElementById('loginPassword').value;var errEl=document.getElementById('loginError');if(!username){errEl.textContent='请输入用户名';errEl.classList.add('show');return;}if(!password){errEl.textContent='请输入密码';errEl.classList.add('show');return;}api('POST','/auth/login',{username:username,password:password}).then(function(res){if(res.error){errEl.textContent=res.error;errEl.classList.add('show');return;}authToken=res.token;localStorage.setItem('jtr_token',authToken);currentUser=res.user;doLogin();}).catch(function(){errEl.textContent='登录失败';errEl.classList.add('show');});});
document.getElementById('logoutBtn').addEventListener('click',function(){authToken='';localStorage.removeItem('jtr_token');currentUser=null;if(wsConn){wsConn.close();wsConn=null;}document.getElementById('appLayout').style.display='none';document.getElementById('loginPage').style.display='flex';document.getElementById('loginUsername').value='';document.getElementById('loginPassword').value='';});
document.querySelectorAll('.nav-item').forEach(function(item){item.addEventListener('click',function(){navigateTo(this.dataset.page);});});
document.getElementById('loginPassword').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('loginBtn').click();});
if(authToken){api('GET','/auth/me').then(function(res){if(res.error){showLogin();return;}currentUser=res;doLogin();}).catch(function(){showLogin();});}
function renderPage(){var c=document.getElementById('mainContent');var u=currentUser;if(!u)return;document.querySelectorAll('[data-page^="settings"],[data-page="audit-log"]').forEach(function(el){el.style.display=u.can_settings||u.role==='brand'?'flex':'none';});switch(currentPage){case'dashboard':renderDashboard();break;case'materials':renderMaterials();break;case'review':renderReview();break;case'summary':renderSummary();break;case'targets':renderTargets();break;case'settings-brand':renderSettingsBrand();break;case'settings-vehicle':renderSettingsVehicle();break;case'settings-sensitive':renderSettingsSensitive();break;case'settings-standard':renderSettingsStandard();break;case'settings-flow':renderSettingsFlow();break;case'settings-agent':renderSettingsAgent();break;case'settings-account':renderSettingsAccount();break;case'audit-log':renderAuditLog();break;}}
function renderDashboard(){var u=currentUser;api('GET','/dashboard').then(function(d){var dlHtml='';if(u.can_view_all||u.role==='brand'){d.agentDeadlines.forEach(function(a){if(!a.deadline)return;var dd=daysUntil(a.deadline);if(dd===null)return;var cls=dd<=2?'urgent':dd<=5?'warn':'normal';dlHtml+='<span style="margin-right:16px;font-size:13px;"><span style="color:var(--text-muted);">'+a.name+'</span> <span class="dl-countdown '+cls+'">'+(dd>0?'剩余'+dd+'天':'已到期')+'</span></span>';});if(dlHtml)dlHtml='<div class="deadline-bar"><span class="dl-icon">⏰</span><span class="dl-text">交付截止</span>'+dlHtml+'</div>';}var recentCards='';d.recentMaterials.forEach(function(m){recentCards+='<div class="mat-card'+(m.premium?' premium':'')+(selectedMaterials.has(m.id)?' selected':'')+'" onclick="showMaterialDetail(\''+m.id+'\')"><div class="mat-preview" onclick="event.stopPropagation();toggleSelectMaterial(\''+m.id+'\',this.parentElement);"><input type="checkbox" class="mat-checkbox" '+(selectedMaterials.has(m.id)?'checked':'')+' onclick="event.stopPropagation();toggleSelectMaterial(\''+m.id+'\',this.closest(\'.mat-card\'));" style="position:absolute;top:8px;left:8px;width:18px;height:18px;z-index:5;accent-color:var(--accent);"><img src="'+getPreviewUrl(m.id)+'" onerror="this.style.display=\'none\'"><div class="play-icon">▶</div><div class="type-badge">'+m.type+'</div><button class="btn btn-danger" style="position:absolute;top:8px;right:8px;z-index:5;width:28px;height:28px;padding:0;font-size:14px;border-radius:50%;" onclick="event.stopPropagation();deleteMaterial(\''+m.id+'\');">🗑</button></div><div class="mat-info"><div class="mat-title">'+m.title+'</div><div class="mat-meta">'+brandTag(m.brand)+' '+(m.model?'<span class="tag tag-accent" style="font-size:11px;">'+m.model+'</span>':'')+' '+(m.platform?platformTag(m.platform):'')+' '+statusTag(m.status)+'</div><div class="mat-footer"><span style="font-size:12px;color:var(--text-muted);">'+m.agent+'</span>'+(m.score?'<div class="mat-score"><span class="score-circle '+scoreClass(m.score)+'" style="width:32px;height:32px;font-size:11px;">'+m.score+'</span></div>':'')+'</div></div></div>';});document.getElementById('mainContent').innerHTML='<div class="page-header"><h1 class="page-title">📊 仪表盘</h1>'+(u.can_view_all||u.role==='brand'?'<div class="page-actions"><button class="btn btn-ghost" onclick="if(confirm(\'确认清空所有历史月份素材？仅保留 '+getCurrentMonth()+' 数据。\'))manualClearMonth()">🗑️ 月度清空</button><button class="btn btn-accent" onclick="showAddMaterial()">＋ 提交素材</button></div>':'')+'</div>'+dlHtml+'<div class="stats-grid"><div class="stat-card"><div class="stat-label">待审核</div><div class="stat-value" style="color:var(--warning);">'+d.pending+'</div></div><div class="stat-card"><div class="stat-label">AI已审待确认</div><div class="stat-value" style="color:var(--info);">'+d.aiReviewed+'</div></div><div class="stat-card"><div class="stat-label">通过率</div><div class="stat-value" style="color:var(--success);">'+d.passRate+'%</div></div><div class="stat-card"><div class="stat-label">⭐ 优质素材</div><div class="stat-value" style="color:var(--premium);">'+d.premiumCount+'</div></div></div><div style="margin-bottom:24px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h3 style="font-size:16px;">最新素材</h3><button class="btn btn-sm btn-ghost" onclick="navigateTo(\'materials\')">查看全部 →</button></div><div class="mat-grid">'+recentCards+'</div></div>';});}

var matViewMode='grid';var matFilter={brand:'',model:'',platform:'',status:'',search:''};

function handleFiles(files){for(var i=0;i<files.length;i++){var f=files[i];var thumb='';if(f.type.startsWith('image/'))thumb=URL.createObjectURL(f);uploadFiles.push({name:f.name,size:f.size,type:f.type,thumb:thumb,file:f});}renderUploadFiles();if(uploadFiles.length){document.getElementById('uploadFormArea').style.display='block';document.getElementById('submitMatBtn').style.display='inline-flex';if(!document.getElementById('matTitle').value)document.getElementById('matTitle').value=uploadFiles[0].name.replace(/\.[^.]+$/,'');}}

function renderSettingsSensitive(){var u=currentUser;if(!u.can_settings&&u.role!=='brand'){document.getElementById('mainContent').innerHTML='<div class="page-header"><h1 class="page-title">🚫 违禁词库</h1></div><div class="card"><div class="card-body"><div class="empty-state"><div class="icon">🔒</div></div></div></div>';return;}api('GET','/sensitive-words').then(function(data){var cats=data.categories||{};var html='<div class="page-header"><h1 class="page-title">🚫 违禁词库</h1></div>';var totalWords=0;var catCounts={};for(var cat in cats){catCounts[cat]=cats[cat].words.length;totalWords+=cats[cat].words.length;}html+='<div class="stats-grid" style="grid-template-columns:repeat(6,1fr);margin-bottom:24px;">';for(var cat in cats){html+='<div class="stat-card"><div class="stat-label">'+cats[cat].name+'</div><div class="stat-value" style="font-size:22px;">'+catCounts[cat]+'</div></div>';}html+='<div class="stat-card"><div class="stat-label">总计</div><div class="stat-value" style="font-size:22px;color:var(--accent);">'+totalWords+'</div></div></div>';html+='<div class="filter-bar"><input class="sw-search" placeholder="🔍 跨分类搜索违禁词..." value="'+(swSearchQuery||'')+'" oninput="swSearchQuery=this.value;renderPage();"></div>';if(swSearchQuery){var results=[];for(var cat in cats){cats[cat].words.forEach(function(w){if(w.word.indexOf(swSearchQuery)>=0)results.push({word:w.word,id:w.id,category:cat,categoryName:cats[cat].name});});}html+='<div class="card"><div class="card-header"><div class="card-title">搜索结果 <span class="tag tag-info" style="margin-left:8px;">'+results.length+'</span></div></div><div class="card-body">';results.forEach(function(r){html+='<span class="sw-tag">'+r.word+' <span class="sw-remove" onclick="removeSensitiveWord('+r.id+')">✕</span></span>';});if(!results.length)html+='<div style="text-align:center;padding:24px;color:var(--text-muted);">未找到匹配词语</div>';html+='</div></div>';}else{html+='<div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;">';for(var cat in cats){html+='<div class="sw-tab'+(swCurrentTab===cat?' active':'')+'" onclick="swCurrentTab=\''+cat+'\';renderPage();">'+cats[cat].name+' ('+cats[cat].words.length+')</div>';}html+='</div>';var currentCat=cats[swCurrentTab];html+='<div class="card"><div class="card-body">';if(currentCat){currentCat.words.forEach(function(w){html+='<span class="sw-tag">'+w.word+' <span class="sw-remove" onclick="removeSensitiveWord('+w.id+')">✕</span></span>';});}html+='<div class="sw-add-row"><input id="swNewWord" placeholder="输入新词..." onkeydown="if(event.key===\'Enter\')addSensitiveWord(\''+swCurrentTab+'\')"><button class="btn btn-sm btn-accent" onclick="addSensitiveWord(\''+swCurrentTab+'\')">添加</button></div>';html+='</div></div>';}document.getElementById('mainContent').innerHTML=html;});}

function renderAuditLog(){var u=currentUser;if(!u.can_settings&&u.role!=='brand'){document.getElementById('mainContent').innerHTML='<div class="page-header"><h1 class="page-title">📜 操作日志</h1></div><div class="card"><div class="card-body"><div class="empty-state"><div class="icon">🔒</div></div></div></div>';return;}var qs='?action='+(auditLogFilter.action||'')+'&user='+(auditLogFilter.user||'');api('GET','/audit-log'+qs).then(function(logs){var users=[];logs.forEach(function(l){if(users.indexOf(l.user)<0)users.push(l.user);});var actionLabels={'approve':'审核通过','reject':'审核驳回','premium':'优质标注','review':'AI审核','submit':'提交素材','resubmit':'驳回重提','clear':'月度清空'};var logHtml='';if(logs.length){logs.forEach(function(l){logHtml+='<div class="log-item"><div class="log-time">'+l.time+'</div><div class="log-user">'+l.user+'</div><span class="log-action '+l.action+'">'+(actionLabels[l.action]||l.action)+'</span><div class="log-target">'+(l.target||'-')+'</div>'+(l.detail?'<div class="log-detail">'+l.detail+'</div>':'')+'</div>';});}else{logHtml='<div class="empty-state"><div class="icon">📜</div><div class="title">暂无操作日志</div></div>';}document.getElementById('mainContent').innerHTML='<div class="page-header"><h1 class="page-title">📜 操作日志</h1><div class="page-actions"><span class="tag tag-info" style="font-size:13px;">共 '+logs.length+' 条</span></div></div>'+'<div class="filter-bar"><select onchange="auditLogFilter.action=this.value;renderPage();"><option value="">全部操作</option><option value="submit"'+(auditLogFilter.action==='submit'?' selected':'')+'>提交素材</option><option value="review"'+(auditLogFilter.action==='review'?' selected':'')+'>AI审核</option><option value="approve"'+(auditLogFilter.action==='approve'?' selected':'')+'>审核通过</option><option value="reject"'+(auditLogFilter.action==='reject'?' selected':'')+'>审核驳回</option><option value="premium"'+(auditLogFilter.action==='premium'?' selected':'')+'>优质标注</option><option value="clear"'+(auditLogFilter.action==='clear'?' selected':'')+'>月度清空</option></select><select onchange="auditLogFilter.user=this.value;renderPage();"><option value="">全部操作人</option>'+users.map(function(un){return '<option value="'+un+'"'+(auditLogFilter.user===un?' selected':'')+'>'+un+'</option>';}).join('')+'</select></div>'+'<div class="card"><div class="card-body" style="padding:0;">'+logHtml+'</div></div>';});}
function renderSettingsStandard(){var u=currentUser;if(!u.can_settings&&u.role!=='brand'){document.getElementById('mainContent').innerHTML='<div class="page-header"><h1 class="page-title">📏 审核标准</h1></div><div class="card"><div class="card-body"><div class="empty-state"><div class="icon">🔒</div></div></div></div>';return;}api('GET','/standards').then(function(standards){if(!standards.dimensions)return;var html='<div class="page-header"><h1 class="page-title">📏 审核标准</h1><div class="page-actions"><button class="btn btn-accent" onclick="saveStandardsFromPage()">💾 保存</button></div></div><div class="card" style="margin-bottom:20px;"><div class="card-header"><div class="card-title">🎯 综合通过分数线</div></div><div class="card-body"><div class="slider-row"><label>综合评分 ≥</label><input type="range" id="overallPass" min="0" max="100" value="'+standards.overallPassScore+'" oninput="this.nextElementSibling.textContent=this.value"><span class="slider-val">'+standards.overallPassScore+'</span></div></div></div>';standards.dimensions.forEach(function(dim){html+='<div class="card" style="margin-bottom:16px;"><div class="card-header"><div class="card-title">'+dim.name+'</div><div style="display:flex;align-items:center;gap:12px;"><span style="font-size:12px;color:var(--text-muted);">权重</span><input class="weight-input" data-dim-weight="'+dim.id+'" type="number" min="0" max="100" value="'+dim.weight+'"><span style="font-size:12px;color:var(--text-muted);">%</span><span style="font-size:12px;color:var(--text-muted);">|</span><span style="font-size:12px;color:var(--text-muted);">通过线</span><input class="weight-input" data-dim-pass="'+dim.id+'" type="number" min="0" max="100" value="'+dim.passScore+'"></div></div><div class="card-body">';dim.checks.forEach(function(ch){html+='<div class="check-item"><input type="checkbox" data-check="'+dim.id+'-'+ch.id+'"'+(ch.enabled?' checked':'')+'><div style="flex:1;"><div class="check-item-name">'+ch.name+'</div><div class="check-item-desc">'+ch.desc+'</div></div></div>';});html+='</div></div>';});var tw=standards.dimensions.reduce(function(s,d){return s+d.weight;},0);html+='<div style="text-align:right;font-size:13px;color:'+(tw===100?'var(--success)':'var(--danger)')+';">权重合计：'+tw+'%'+(tw!==100?'（需调整至100%）':' ✓')+'</div>';document.getElementById('mainContent').innerHTML=html;});}
function saveStandardsFromPage(){api('GET','/standards').then(function(standards){if(!standards.dimensions)return;standards.overallPassScore=parseInt(document.getElementById('overallPass').value)||70;standards.dimensions.forEach(function(dim){var wE=document.querySelector('[data-dim-weight="'+dim.id+'"]');var pE=document.querySelector('[data-dim-pass="'+dim.id+'"]');if(wE)dim.weight=parseInt(wE.value)||0;if(pE)dim.passScore=parseInt(pE.value)||60;dim.checks.forEach(function(ch){var cE=document.querySelector('[data-check="'+dim.id+'-'+ch.id+'"]');if(cE)ch.enabled=cE.checked;});});api('PUT','/standards',standards).then(function(){showToast('审核标准已保存','success');renderPage();});});}
function renderSettingsFlow(){var u=currentUser;if(!u.can_settings&&u.role!=='brand'){document.getElementById('mainContent').innerHTML='<div class="page-header"><h1 class="page-title">⚙️ 审核流程</h1></div><div class="card"><div class="card-body"><div class="empty-state"><div class="icon">🔒</div></div></div></div>';return;}api('GET','/flow').then(function(f){var html='<div class="page-header"><h1 class="page-title">⚙️ 审核流程</h1><div class="page-actions"><button class="btn btn-accent" onclick="saveFlowFromPage()">💾 保存</button></div></div><div class="card" style="margin-bottom:20px;"><div class="card-header"><div class="card-title">📋 流程图</div></div><div class="card-body"><div style="display:flex;align-items:center;justify-content:center;gap:0;padding:20px 0;flex-wrap:wrap;"><div style="text-align:center;padding:12px 16px;border-radius:var(--radius);background:var(--bg-secondary);border:1px solid var(--border);min-width:80px;'+(f.aiAutoReview===false?'opacity:.4;':'')+'"><div style="font-size:24px;">🤖</div><div style="font-size:12px;color:var(--text-secondary);">AI审核</div></div><span style="font-size:20px;color:var(--text-muted);padding:0 4px;">→</span><div style="text-align:center;padding:12px 16px;border-radius:var(--radius);background:var(--bg-secondary);border:1px solid var(--border);min-width:80px;'+(f.humanConfirm===false?'opacity:.4;':'')+'"><div style="font-size:24px;">👤</div><div style="font-size:12px;color:var(--text-secondary);">人工确认</div></div><span style="font-size:20px;color:var(--text-muted);padding:0 4px;">→</span><div style="text-align:center;padding:12px 16px;border-radius:var(--radius);background:var(--bg-secondary);border:1px solid var(--border);min-width:80px;"><div style="font-size:24px;">✅</div><div style="font-size:12px;color:var(--text-secondary);">通过/驳回</div></div></div></div></div><div class="card"><div class="card-header"><div class="card-title">流程配置</div></div><div class="card-body"><div class="setting-row"><div><div class="setting-row-label">🤖 AI自动审核</div><div class="setting-row-desc">素材提交后自动触发AI审核</div></div><label class="toggle"><input type="checkbox" id="flowAiAuto"'+(f.aiAutoReview?' checked':'')+'><span class="toggle-slider"></span></label></div><div class="setting-row"><div><div class="setting-row-label">👤 人工确认</div><div class="setting-row-desc">AI审核后需人工确认</div></div><label class="toggle"><input type="checkbox" id="flowHumanConfirm"'+(f.humanConfirm?' checked':'')+'><span class="toggle-slider"></span></label></div><div class="setting-row"><div><div class="setting-row-label">🔄 允许驳回重提</div></div><label class="toggle"><input type="checkbox" id="flowResubmit"'+(f.allowResubmit?' checked':'')+'><span class="toggle-slider"></span></label></div><div class="setting-row"><div><div class="setting-row-label">🔢 重提次数上限</div></div><input class="weight-input" id="flowResubmitLimit" type="number" min="1" max="10" value="'+f.resubmitLimit+'"></div><div class="setting-row"><div><div class="setting-row-label">🚫 低于分数自动驳回</div></div><input class="weight-input" id="flowAutoReject" type="number" min="0" max="100" value="'+f.autoRejectBelow+'"></div></div></div>';document.getElementById('mainContent').innerHTML=html;});}
function saveFlowFromPage(){api('PUT','/flow',{aiAutoReview:document.getElementById('flowAiAuto').checked,humanConfirm:document.getElementById('flowHumanConfirm').checked,allowResubmit:document.getElementById('flowResubmit').checked,resubmitLimit:parseInt(document.getElementById('flowResubmitLimit').value)||3,autoRejectBelow:parseInt(document.getElementById('flowAutoReject').value)||0}).then(function(){showToast('审核流程已保存','success');renderPage();});}
function renderSettingsAgent(){var u=currentUser;if(!u.can_settings&&u.role!=='brand'){document.getElementById('mainContent').innerHTML='<div class="page-header"><h1 class="page-title">🏢 代理管理</h1></div><div class="card"><div class="card-body"><div class="empty-state"><div class="icon">🔒</div></div></div></div>';return;}api('GET','/agents').then(function(agents){api('GET','/brands').then(function(brands){var html='<div class="page-header"><h1 class="page-title">🏢 代理管理</h1><div class="page-actions"><button class="btn btn-accent" onclick="showAddAgent()">＋ 新增代理</button></div></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>代理公司</th><th>品牌</th><th>登录名</th><th>截止日</th><th>交付节奏</th><th>操作</th></tr></thead><tbody>';agents.forEach(function(a){var bTags=(a.brands||[]).map(function(bn){return brandTag(bn);}).join(' ');var d=a.deadline?daysUntil(a.deadline):null;var dCls=d!==null?(d<=2?'urgent':d<=5?'warn':'normal'):'normal';html+='<tr><td style="color:var(--text-primary);font-weight:500;">'+a.name+'</td><td>'+bTags+'</td><td><code style="background:var(--bg-primary);padding:2px 8px;border-radius:4px;font-size:12px;">'+(a.username||'-')+'</code></td><td>'+(a.deadline?a.deadline:'-')+(d!==null?' <span class="dl-countdown '+dCls+'" style="font-size:11px;">'+(d>0?d+'天':'到期')+'</span>':'')+'</td><td>'+(a.rhythm||'-')+'</td><td><button class="btn btn-xs btn-ghost" onclick="showEditAgent('+a.id+')">编辑</button> <button class="btn btn-xs btn-ghost" style="color:var(--danger);" onclick="if(confirm(\'确认删除?\'))deleteAgent('+a.id+')">删除</button></td></tr>';});html+='</tbody></table></div></div>';document.getElementById('mainContent').innerHTML=html;});});}
function showAddAgent(){api('GET','/brands').then(function(brands){var brandChecks=brands.map(function(b){return '<label style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;cursor:pointer;"><input type="checkbox" class="aBrandCheck" value="'+b.name+'" checked><span>'+brandTag(b.name)+'</span></label>';}).join('');document.getElementById('modalTitle').textContent='新增代理公司';document.getElementById('modalBody').innerHTML='<div class="form-group"><label>公司名称 *</label><input id="aName"></div><div class="form-group"><label>关联品牌 *（可多选）</label><div style="padding:8px 0;">'+brandChecks+'</div></div><div class="grid-2"><div class="form-group"><label>登录名 *</label><input id="aUsername" placeholder="英文/拼音"></div><div class="form-group"><label>登录密码 *</label><input id="aPassword" type="password" placeholder="至少6位"></div></div><div class="grid-2"><div class="form-group"><label>联系人</label><input id="aContact"></div><div class="form-group"><label>联系电话</label><input id="aPhone"></div></div><div class="grid-2"><div class="form-group"><label>月度目标（条/品牌）</label><input id="aTarget" type="number" value="10" min="1"></div><div class="form-group"><label>交付截止日</label><input id="aDeadline" type="date" value="2026-05-25"></div></div><div class="form-group"><label>交付节奏</label><input id="aRhythm" placeholder="如：每周5条、每月15条"></div>';document.getElementById('modalFooter').innerHTML='<button class="btn btn-ghost" onclick="closeModal(\'materialModal\')">取消</button><button class="btn btn-accent" onclick="submitAgent()">保存</button>';openModal('materialModal');});}
function showEditAgent(id){api('GET','/agents').then(function(agents){api('GET','/brands').then(function(brands){var a=agents.find(function(x){return x.id===id;});if(!a)return;var brandChecks=brands.map(function(b){return '<label style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;cursor:pointer;"><input type="checkbox" class="aBrandCheck" value="'+b.name+'"'+((a.brands||[]).indexOf(b.name)>=0?' checked':'')+'><span>'+brandTag(b.name)+'</span></label>';}).join('');document.getElementById('modalTitle').textContent='编辑代理 - '+a.name;document.getElementById('modalBody').innerHTML='<div class="form-group"><label>公司名称 *</label><input id="aName" value="'+a.name+'"></div><div class="form-group"><label>关联品牌 *（可多选）</label><div style="padding:8px 0;">'+brandChecks+'</div></div><div class="grid-2"><div class="form-group"><label>登录名 *</label><input id="aUsername" value="'+(a.username||'')+'"></div><div class="form-group"><label>登录密码</label><input id="aPassword" type="password" placeholder="留空不修改"><div class="form-hint">留空保持原密码</div></div></div><div class="grid-2"><div class="form-group"><label>联系人</label><input id="aContact" value="'+a.contact+'"></div><div class="form-group"><label>联系电话</label><input id="aPhone" value="'+a.phone+'"></div></div><div class="grid-2"><div class="form-group"><label>月度目标（条/品牌）</label><input id="aTarget" type="number" value="'+a.monthTarget+'" min="1"></div><div class="form-group"><label>交付截止日</label><input id="aDeadline" type="date" value="'+(a.deadline||'')+'"></div></div><div class="form-group"><label>交付节奏</label><input id="aRhythm" value="'+(a.rhythm||'')+'"></div>';document.getElementById('modalFooter').innerHTML='<button class="btn btn-ghost" onclick="closeModal(\'materialModal\')">取消</button><button class="btn btn-accent" onclick="saveEditAgent('+id+')">保存</button>';openModal('materialModal');});});}
function getCheckedBrands(){var checks=document.querySelectorAll('.aBrandCheck');var result=[];checks.forEach(function(c){if(c.checked)result.push(c.value);});return result;}
function submitAgent(){var name=document.getElementById('aName').value.trim();if(!name){showToast('请填写公司名称','error');return;}var brands=getCheckedBrands();if(!brands.length){showToast('请至少选择一个品牌','error');return;}var username=document.getElementById('aUsername').value.trim();if(!username){showToast('请填写登录名','error');return;}var password=document.getElementById('aPassword').value;if(!password||password.length<6){showToast('密码至少6位','error');return;}api('POST','/agents',{name:name,brands:brands,username:username,password:password,contact:document.getElementById('aContact').value.trim()||'',phone:document.getElementById('aPhone').value.trim()||'',monthTarget:parseInt(document.getElementById('aTarget').value)||10,deadline:document.getElementById('aDeadline').value||'',rhythm:document.getElementById('aRhythm').value.trim()||''}).then(function(res){if(res.error){showToast(res.error,'error');return;}closeModal('materialModal');showToast('代理已添加','success');renderPage();});}
function saveEditAgent(id){var brands=getCheckedBrands();if(!brands.length){showToast('请至少选择一个品牌','error');return;}var username=document.getElementById('aUsername').value.trim();if(!username){showToast('请填写登录名','error');return;}var data={name:document.getElementById('aName').value.trim(),brands:brands,username:username,contact:document.getElementById('aContact').value.trim(),phone:document.getElementById('aPhone').value.trim(),monthTarget:parseInt(document.getElementById('aTarget').value)||10,deadline:document.getElementById('aDeadline').value||'',rhythm:document.getElementById('aRhythm').value.trim()||''};var password=document.getElementById('aPassword').value;if(password){if(password.length<6){showToast('密码至少6位','error');return;}data.password=password;}api('PUT','/agents/'+id,data).then(function(res){if(res.error){showToast(res.error,'error');return;}closeModal('materialModal');showToast('代理信息已更新','success');renderPage();});}
function deleteAgent(id){api('DELETE','/agents/'+id).then(function(){showToast('已删除','info');renderPage();});}
function renderSettingsAccount(){var u=currentUser;var html='<div class="page-header"><h1 class="page-title">🔑 账号设置</h1></div>';html+='<div class="card"><div class="card-header"><div class="card-title">当前登录信息</div></div><div class="card-body"><div class="grid-2"><div><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">身份</div><div style="font-size:14px;font-weight:500;">'+u.name+'</div></div><div><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">权限</div><div style="font-size:14px;">'+(u.can_view_all||u.role==='brand'?'全量数据访问':'仅查看本代理数据')+'</div></div></div></div></div>';document.getElementById('mainContent').innerHTML=html;}
</script>
</body>
